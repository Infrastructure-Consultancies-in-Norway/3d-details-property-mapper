name: Update IFC manifest

on:
  push:
    branches: [ifc-details]
    paths:
      - 'ifc-files/output/*.ifc'
      - 'scripts/generate_ifc_manifest.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ifc-details

      - name: Generate manifest
        run: python scripts/generate_ifc_manifest.py

      - name: Commit manifest if changed
        run: |
          if [ -n "$(git status --porcelain ifc-files/output/manifest.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ifc-files/output/manifest.json
            git commit -m "Update IFC manifest"
            git push
          fi
