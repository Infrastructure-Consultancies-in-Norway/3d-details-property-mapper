version: 1.0

models:
  - SNACKS_Detalj_Membran.ifc

spatial_structure:
  IfcProject: SNACKS Detalj Membran
  IfcSite: SNACKS Detalj Membran
  IfcBuilding: Bru
  IfcBuildingStorey: Membran

selection:
  ifc_class: IfcElement
  exclude_name_patterns:
    - '^Merknad$'

delete_property_sets:
  - Tekla Common
  - Tekla Quantity
  - Tekla Reinforcement - General
  - Tekla Reinforcement - Bending List
  - Tekla Reinforcement - End Conditions
  - Pours
  - BeamBaseQuantities
  - Pset_BeamCommon
  - ColumnBaseQuantities
  - Pset_ColumnCommon
  - PlateBaseQuantities
  - Pset_PlateCommon
  - SlabBaseQuantities
  - Pset_SlabCommon
  - WallBaseQuantities
  - Pset_WallCommon

base_property_sets:
  - BIM_Tverrfaglig
  - KON_Felles

default_values:
  BIM_Tverrfaglig:
    'BIM.04 - MMI': '350'
    'BIM.05 - Elementnavn': Detaljelement
    'BIM.06 - Fag': KON
    'BIM.07 - Revisjon': A
    'BIM.08 - Revisjonsdato': '2023-01-16'

  KON_Felles:
    'KON.01 - Konstruksjonsnummer': K100
    'KON.03 - Akse': '01'
    'KON.10 - Konstruksjonsinndeling': Bru
    'KON.11 - Konstruksjonsdel': Membrandetalj
    'KON.13 - Elementnavn': Detaljelement
    'KON.20 - Produksjonsenhet': PLD-1002
    'KON.30 - Plasseringsprioritet': 2 - Viker for 1
    'KON.31 - Plasseringsmerknad': Ikke angitt
    'KON.40 - Materialtype': Uspesifisert
    'KON.41 - Materialspesifikasjon': Uspesifisert
    'KON.51 - Produksjonsmerknad 1': Ikke angitt
    'KON.53 - Utførelsesmerknad 1': Ikke angitt

  KON_Betong:
    'BET.01 - Utførelsesklasse': '2'
    'BET.02 - Nøyaktighetsklasse': B
    'BET.04 - Materialspesifikasjon (dup)': B45 SV-Standard
    'BET.10 - Produksjonsmetode': Plasstøpt
    'BET.11 - Forskaling': Stående bord
    'BET.21 - Overdekning hovedarmering': 'UK, NS og FS: 75mm ±15mm, OK: 65mm ±15mm'
    'BET.30 - Diameter monteringsstenger': 12 mm
    'BET.31 - Overdekning monteringsstenger': 'UK, NS og FS: 60mm ±5mm, OK: 50mm ±5mm'

  KON_Festemidler:
    'FMI.01 - Navn': Boltedybel M20
    'FMI.02 - Antall skruer': 1
    'FMI.03 - Skruediameter': 20 mm
    'FMI.04 - Skruelengde': 100 mm
    'FMI.05 - Kvalitet': '8.8'
    'FMI.06 - Monteringssted': Byggeplass
    'FMI.10 - Hulldiameter': 22 mm
    'FMI.11 - Hullmerknad': Ikke angitt
    'FMI.30 - Mutternavn': Ikke aktuelt
    'FMI.31 - Antall muttere': 0
    'FMI.40 - Skivenavn': Ikke aktuelt
    'FMI.41 - Antall skiver': 0

rules:
  - id: wall
    name_pattern: '^Vegg$'
    property_sets:
      - KON_Betong
    values:
      BIM_Tverrfaglig:
        'BIM.05 - Elementnavn': Vegg
      KON_Felles:
        'KON.10 - Konstruksjonsinndeling': Underbygning
        'KON.11 - Konstruksjonsdel': Vegg
        'KON.13 - Elementnavn': Vegg
        'KON.40 - Materialtype': Betong
        'KON.41 - Materialspesifikasjon': B45 SV-Standard

  - id: membrane
    name_pattern: '^Membran$'
    property_sets:
      - KON_Felles
    values:
      BIM_Tverrfaglig:
        'BIM.05 - Elementnavn': Membran
      KON_Felles:
        'KON.11 - Konstruksjonsdel': Fuktisolering
        'KON.13 - Elementnavn': Membran
        'KON.40 - Materialtype': Fuktisolering
        'KON.41 - Materialspesifikasjon': Ikke angitt

  - id: bolt-dowel
    name_pattern: '^Boltedybel$'
    property_sets:
      - KON_Festemidler
    values:
      BIM_Tverrfaglig:
        'BIM.05 - Elementnavn': Boltedybel
      KON_Felles:
        'KON.11 - Konstruksjonsdel': Boltedybel
        'KON.13 - Elementnavn': Boltedybel
        'KON.40 - Materialtype': Stål
        'KON.41 - Materialspesifikasjon': '8.8'
        'KON.51 - Produksjonsmerknad 1': Ikke aktuelt

  - id: sleeve
    name_pattern: '^Hylse$'
    property_sets:
      - KON_Festemidler
    values:
      BIM_Tverrfaglig:
        'BIM.05 - Elementnavn': Hylse
      KON_Felles:
        'KON.11 - Konstruksjonsdel': Hylse
        'KON.13 - Elementnavn': Hylse
        'KON.40 - Materialtype': Uspesifisert
        'KON.41 - Materialspesifikasjon': Ikke angitt
        'KON.51 - Produksjonsmerknad 1': Ikke aktuelt
      KON_Festemidler:
        'FMI.01 - Navn': Hylse for boltedybel M20
        'FMI.02 - Antall skruer': 0
        'FMI.03 - Skruediameter': 0 mm
        'FMI.04 - Skruelengde': 0 mm
        'FMI.05 - Kvalitet': Ikke aktuelt
        'FMI.10 - Hulldiameter': 24 mm
        'FMI.11 - Hullmerknad': Ikke aktuelt
