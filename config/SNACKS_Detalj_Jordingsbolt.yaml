version: 1.0

models:
  - SNACKS_Detalj_Jordingsbolt.ifc

spatial_structure:
  IfcProject: SNACKS Detalj Jordingsbolt
  IfcSite: SNACKS Detalj Jordingsbolt
  IfcBuilding: Bru
  IfcBuildingStorey: Jordingsbolt

selection:
  ifc_class: IfcElement
  exclude_name_patterns:
    - '^Ramme$'

delete_property_sets:
  - Tekla Common
  - Tekla Quantity
  - SlabBaseQuantities
  - Pset_SlabCommon

base_property_sets:
  - BIM_Tverrfaglig
  - KON_Felles

default_values:
  BIM_Tverrfaglig:
    'BIM.04 - MMI': '350'
    'BIM.05 - Elementnavn': Detaljelement
    'BIM.06 - Fag': KON
    'BIM.07 - Revisjon': A
    'BIM.08 - Revisjonsdato': '2023-01-16'

  KON_Felles:
    'KON.01 - Konstruksjonsnummer': K100
    'KON.03 - Akse': '01'
    'KON.10 - Konstruksjonsinndeling': Bru
    'KON.11 - Konstruksjonsdel': Jordingsdetalj
    'KON.13 - Elementnavn': Detaljelement
    'KON.20 - Produksjonsenhet': PLD-1002
    'KON.30 - Plasseringsprioritet': 2 - Viker for 1
    'KON.31 - Plasseringsmerknad': Ikke angitt
    'KON.40 - Materialtype': Uspesifisert
    'KON.41 - Materialspesifikasjon': Uspesifisert
    'KON.51 - Produksjonsmerknad 1': Ikke angitt
    'KON.53 - Utførelsesmerknad 1': Ikke angitt

  KON_Betong:
    'BET.01 - Utførelsesklasse': '2'
    'BET.02 - Nøyaktighetsklasse': B
    'BET.04 - Materialspesifikasjon (dup)': B45 SV-Standard
    'BET.10 - Produksjonsmetode': Plasstøpt
    'BET.11 - Forskaling': Stående bord
    'BET.21 - Overdekning hovedarmering': 'UK, NS og FS: 75mm ±15mm, OK: 65mm ±15mm'
    'BET.30 - Diameter monteringsstenger': 12 mm
    'BET.31 - Overdekning monteringsstenger': 'UK, NS og FS: 60mm ±5mm, OK: 50mm ±5mm'

  KON_Stål:
    'STL.01 - Utførelsesklasse': EXC1
    'STL.02 - Tilvirkningstoleranse': '1'
    'STL.03 - Monteringstoleranse': '1'
    'STL.11 - Farge på siste dekkestrøk': RAL7036
    'STL.31 - Materialspesifikasjon (dup)': S355ML
    'STL.32 - Materialstandard': NS-EN 10025-4
    'STL.50 - Korrosjonsbeskyttelse': System 1 iht. SVV hb. N400 pkt. 9.2.1

  KON_Festemidler:
    'FMI.01 - Navn': Jordingsbolt
    'FMI.02 - Antall skruer': 1
    'FMI.03 - Skruediameter': 20 mm
    'FMI.04 - Skruelengde': 100 mm
    'FMI.05 - Kvalitet': '8.8'
    'FMI.06 - Monteringssted': Byggeplass
    'FMI.10 - Hulldiameter': 22 mm
    'FMI.11 - Hullmerknad': Ikke angitt
    'FMI.30 - Mutternavn': Ikke aktuelt
    'FMI.31 - Antall muttere': 0
    'FMI.40 - Skivenavn': Ikke aktuelt
    'FMI.41 - Antall skiver': 0

rules:
  - id: foundation
    name_pattern: '^Fundament$'
    property_sets:
      - KON_Betong
    values:
      BIM_Tverrfaglig:
        'BIM.05 - Elementnavn': Fundament
      KON_Felles:
        'KON.10 - Konstruksjonsinndeling': Underbygning
        'KON.11 - Konstruksjonsdel': Fundament
        'KON.13 - Elementnavn': Fundament
        'KON.40 - Materialtype': Betong
        'KON.41 - Materialspesifikasjon': B45 SV-Standard

  - id: landkar
    name_pattern: '^Landkar$'
    property_sets:
      - KON_Betong
    values:
      BIM_Tverrfaglig:
        'BIM.05 - Elementnavn': Landkar
      KON_Felles:
        'KON.10 - Konstruksjonsinndeling': Underbygning
        'KON.11 - Konstruksjonsdel': Landkar
        'KON.13 - Elementnavn': Landkar
        'KON.40 - Materialtype': Betong
        'KON.41 - Materialspesifikasjon': B45 SV-Standard

  - id: grounding-conductor
    name_pattern: '^Jordingsledning$'
    property_sets:
      - KON_Stål
    values:
      BIM_Tverrfaglig:
        'BIM.05 - Elementnavn': Jordingsledning
      KON_Felles:
        'KON.11 - Konstruksjonsdel': Jordingsledning
        'KON.13 - Elementnavn': Jordingsledning
        'KON.40 - Materialtype': Stål
        'KON.41 - Materialspesifikasjon': Rustfritt stål
        'KON.51 - Produksjonsmerknad 1': Ikke aktuelt
        'KON.53 - Utførelsesmerknad 1': Ikke angitt
      KON_Stål:
        'STL.31 - Materialspesifikasjon (dup)': Rustfritt stål
        'STL.32 - Materialstandard': Ikke angitt
        'STL.50 - Korrosjonsbeskyttelse': Ikke aktuelt

  - id: grounding-bolt
    name_pattern: '^Jordingsbolt$'
    property_sets:
      - KON_Festemidler
    values:
      BIM_Tverrfaglig:
        'BIM.05 - Elementnavn': Jordingsbolt
      KON_Felles:
        'KON.11 - Konstruksjonsdel': Jordingsbolt
        'KON.13 - Elementnavn': Jordingsbolt
        'KON.40 - Materialtype': Stål
        'KON.41 - Materialspesifikasjon': '8.8'
        'KON.51 - Produksjonsmerknad 1': Ikke aktuelt
        'KON.53 - Utførelsesmerknad 1': Ikke angitt
      KON_Festemidler:
        'FMI.01 - Navn': Jordingsbolt
        'FMI.02 - Antall skruer': 1
        'FMI.30 - Mutternavn': Ikke aktuelt
        'FMI.31 - Antall muttere': 0
        'FMI.40 - Skivenavn': Ikke aktuelt
        'FMI.41 - Antall skiver': 0
